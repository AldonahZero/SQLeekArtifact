[dsnForFuzzer]
Description=MySQL Database
Driver=/root/libraries/libmyodbc8a.so
PORT=8888
MetaQuery=SELECT name, type, parentname FROM (SELECT table_name as name, 'TABLE' as type, '' as parentname FROM information_schema.tables WHERE UPPER(table_schema)=(select UPPER(database())) UNION SELECT column_name as name, column_type as type, table_name as parentname FROM information_schema.columns WHERE UPPER(table_schema)=(select UPPER(database())) UNION SELECT trigger_name as name, 'TRIGGER' as type, null as parentname FROM information_schema.triggers WHERE UPPER(trigger_schema)=(select UPPER(database())) UNION SELECT index_name as name, 'INDEX' as type, null as parentname FROM information_schema.statistics WHERE UPPER(table_schema)=(select UPPER(database()))) AS t
ResetStmts=create database tmp * use tmp * drop database test * create database test * use test
ResetStmtSpliter=*
ResetReconnMode=1
BlackList=((?i)((USE)|(SLEEP)|(SHUTDOWN)|(GRANT)|(GLOBAL)))
DATABASE=mysql
USER=root
ResetTimeoutLevel0=1000
ResetScriptLevel1=/workspace/scripts/reset_lv1.sh 8888 /root/bin_llvmcov/usr/local/mysql/bin/mariadbd > /dev/null
ResetTimeoutLevel1=10000

